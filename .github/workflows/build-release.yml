name: Build & Release

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload assets to (e.g. v1.4.1)
        required: true
        default: v1.4.1

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            assets: |
              release/LuLuneAutoClicker-Setup.exe
              release/LuLuneAutoClicker-Windows.zip
              release/latest.yml
          - os: macos-latest
            script: dist:mac
            assets: |
              release/LuLuneAutoClicker-macOS-*.dmg
              release/LuLuneAutoClicker-macOS-*.zip
              release/latest-mac.yml
          - os: ubuntu-latest
            script: dist:linux
            assets: |
              release/LuLuneAutoClicker-Linux.AppImage
              release/LuLuneAutoClicker-Linux.zip
              release/latest-linux.yml

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libx11-dev libxtst-dev libpng-dev libfuse2

      - name: Install dependencies
        run: npm ci

      - name: Package app
        run: npm run ${{ matrix.script }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-build
          path: ${{ matrix.assets }}
          if-no-files-found: error

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
          name: LuLune AutoClicker ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
          body_path: .github/release-body.md
          generate_release_notes: false
          files: ${{ matrix.assets }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
